
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password | Bestie University</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:linear-gradient(135deg,#ffe0ed,#fff8f6,#d8f4ef);
      font-family:Nunito,Arial,sans-serif;
      color:#65374d;
    }
    .card {
      width:min(440px,100%);
      background:white;
      border:2px solid #f1c5d7;
      border-radius:25px;
      padding:35px;
      text-align:center;
      box-shadow:0 15px 40px #874d6820;
    }
    .logo {width:80px}
    input,button {
      width:100%;
      padding:15px;
      border-radius:12px;
      font:inherit;
      margin-top:12px;
      box-sizing:border-box;
    }
    input {border:2px solid #ebcad8}
    button {
      border:0;
      background:#b95d91;
      color:white;
      font-weight:900;
      cursor:pointer;
    }
    button:disabled {opacity:.6}
    #message {margin-top:18px;line-height:1.6}
    a {color:#a14d7b;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logo.png"
         alt="Books & Besties">

    <h1>Forgot Your Password? 💌</h1>
    <p>Let's get you back into Bestie University!</p>

    <form id="resetRequestForm">
      <input id="email" type="email"
             autocomplete="email"
             placeholder="Your campus email"
             required>
      <button id="sendButton" type="submit">
        Send My Reset Link ♡
      </button>
    </form>

    <p id="message" role="status"></p>
    <div style="display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:22px;">
  <a href="index.html#home">🏠 Campus Home</a>
  <a href="login.html">🔐 Campus Login</a>
</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("resetRequestForm");
      const emailInput = document.getElementById("email");
      const button = document.getElementById("sendButton");
      const message = document.getElementById("message");
      const config = window.BB_CONFIG;

      if (!window.supabase ||
          !config?.SUPABASE_URL ||
          !config?.SUPABASE_ANON_KEY) {
        message.textContent = "Campus recovery is temporarily unavailable.";
        button.disabled = true;
        return;
      }

      const client = window.supabase.createClient(
        config.SUPABASE_URL,
        config.SUPABASE_ANON_KEY
      );

      form.addEventListener("submit", async event => {
        event.preventDefault();
        button.disabled = true;
        message.textContent = "💌 Sending your recovery link...";

        try {
          const redirectTo =
            window.location.origin + "/reset-password.html";

          const { error } =
            await client.auth.resetPasswordForEmail(
              emailInput.value.trim(),
              { redirectTo }
            );

          if (error) throw error;

          message.textContent =
            "💗 If an account exists for this email, " +
            "a recovery link will be sent. " +
            "Check your inbox and spam folder.";
        } catch (error) {
          console.error("Password reset request:", error);
          message.textContent =
            "We couldn't send your reset request. " +
            "Please try again shortly.";
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
