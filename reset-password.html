
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | Bestie University</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:linear-gradient(135deg,#ffe0ed,#fff8f6,#d8f4ef);
      font-family:Nunito,Arial,sans-serif;
      color:#65374d;
    }
    .card {
      width:min(440px,100%);
      background:white;
      border:2px solid #f1c5d7;
      border-radius:25px;
      padding:35px;
      text-align:center;
      box-shadow:0 15px 40px #874d6820;
    }
    .logo {width:80px}
    input,button {
      width:100%;
      padding:15px;
      border-radius:12px;
      font:inherit;
      margin-top:12px;
      box-sizing:border-box;
    }
    input {border:2px solid #ebcad8}
    button {
      border:0;
      background:#b95d91;
      color:white;
      font-weight:900;
      cursor:pointer;
    }
    button:disabled {opacity:.6}
    #message {margin-top:18px;line-height:1.6}
    a {color:#a14d7b;font-weight:800}
    [hidden] {display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logo.png"
         alt="Books & Besties">

    <h1>New Password, Bestie! 🔐💗</h1>
    <p>Choose a new password for your campus account.</p>

    <form id="passwordForm" hidden>
      <input id="password" type="password"
             autocomplete="new-password"
             placeholder="New password (8+ characters)"
             minlength="8" required>

      <input id="confirmPassword" type="password"
             autocomplete="new-password"
             placeholder="Confirm new password"
             minlength="8" required>

      <button id="saveButton" type="submit">
        Save My New Password ♡
      </button>
    </form>

    <p id="message" role="status">
      💌 Verifying your recovery link...
    </p>

    <a href="forgot-password.html">
      Request Another Reset Link
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>

  <script>
    (async () => {
      "use strict";

      const config = window.BB_CONFIG;
      const form = document.getElementById("passwordForm");
      const message = document.getElementById("message");
      const button = document.getElementById("saveButton");

      if (!window.supabase ||
          !config?.SUPABASE_URL ||
          !config?.SUPABASE_ANON_KEY) {
        message.textContent = "Campus recovery is unavailable.";
        return;
      }

      const client = window.supabase.createClient(
        config.SUPABASE_URL,
        config.SUPABASE_ANON_KEY,
        {
          auth: {
            detectSessionInUrl: true,
            persistSession: true
          }
        }
      );

      let recoveryVerified = false;

      const { data: { subscription } } =
        client.auth.onAuthStateChange((event) => {
          if (event === "PASSWORD_RECOVERY") {
            recoveryVerified = true;
            form.hidden = false;
            message.textContent =
              "💗 Link verified! Enter your new password.";
          }
        });

      try {
        const params = new URLSearchParams(
          window.location.search
        );

        const hash = new URLSearchParams(
          window.location.hash.substring(1)
        );

        const authError =
          params.get("error_description") ||
          hash.get("error_description");

        if (authError) {
          throw new Error(
            "This recovery link has expired or is invalid."
          );
        }

        const tokenHash = params.get("token_hash");
        const code = params.get("code");

        if (tokenHash && params.get("type") === "recovery") {
          const { error } = await client.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });
          if (error) throw error;
          recoveryVerified = true;
        } else if (code) {
          const { error } =
            await client.auth.exchangeCodeForSession(code);
          if (error) throw error;
          recoveryVerified = true;
        } else if (
          hash.get("access_token") &&
          hash.get("type") === "recovery"
        ) {
          const { error } = await client.auth.setSession({
            access_token: hash.get("access_token"),
            refresh_token: hash.get("refresh_token")
          });
          if (error) throw error;
          recoveryVerified = true;
        }

        if (recoveryVerified) {
          form.hidden = false;
          message.textContent =
            "💗 Link verified! Enter your new password.";
        } else {
          message.textContent =
            "This page needs a valid recovery link. " +
            "Please request a new one.";
        }
      } catch (error) {
        console.error("Recovery verification:", error);
        message.textContent =
          "Your recovery link is invalid or expired. " +
          "Please request a new one.";
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();

        if (!recoveryVerified) return;

        const password =
          document.getElementById("password").value;

        const confirm =
          document.getElementById("confirmPassword").value;

        if (password !== confirm) {
          message.textContent = "Passwords don't match, Bestie!";
          return;
        }

        button.disabled = true;
        message.textContent = "🔐 Updating your password...";

        try {
          const { error } = await client.auth.updateUser({
            password
          });

          if (error) throw error;

          form.hidden = true;
          message.textContent =
            "🎉 Password updated! " +
            "You can now log in with your new password.";

          subscription.unsubscribe();
          await client.auth.signOut();
        } catch (error) {
          console.error("Password update:", error);
          message.textContent =
            "We couldn't update your password. " +
            "Please request a new recovery link if needed.";
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
